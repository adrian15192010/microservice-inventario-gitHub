server:
  port: 8050

security:
  jwt:
    secret-key:
    expiration: 86400000
    refresh-token:
      expiration: 604800000

spring:
  application:
    name: msvc-authservice
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/authserviceMicroDb
    username:
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
  config:
    import: optional:configserver:http://localhost:8888

eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka


