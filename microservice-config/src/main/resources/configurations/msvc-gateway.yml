server:
  port: 8080

spring:
  application:
    name: msvc-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
      routes:
        - id: students
          uri: 'http://localhost:8090'
          predicates:
            - Path=/api/student/**
        - id: courses
          uri: 'http://localhost:9090'
          predicates:
            - Path=/api/course/**
        - id: authservices
          uri: 'http://localhost:8050'
          predicates:
            - Path=/api/auth/**
        - id: programadors
          uri: 'http://localhost:9050'
          predicates:
            - Path=/api/program/**
eureka:
  client:
    register-with-eureka: false
